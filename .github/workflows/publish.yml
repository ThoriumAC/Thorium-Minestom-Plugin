# Publishes the shaded jar to GitHub Packages. Tag the commit on the branch you are
# releasing (main for 26.2, mc-1.21.11 for 1.21.11); the version comes from build.gradle.kts,
# and GitHub Packages refuses to overwrite one that already exists.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
