# Thorium configuration. Written to <data-dir>/thorium.properties on first start.
# org_... network ingest token (needs server-name).
server-token=
# Server name from the dashboard. Only used with a network token.
server-name=
# false = log verdicts only; staff alerts still shown.
enforce=true
# false = skip setbacks and block resyncs.
mitigate=true
# Console command for bans, e.g. "ban %player% %reason%". Minestom has no ban list:
# when empty, a ban only kicks the player.
ban-command=
# Console command for unbans made in the dashboard, e.g. "unban %player%".
unban-command=
send-ip=false
# & colour codes. Placeholders: %player% %check% %vl% %confidence% %reason% %action%
alert-format=&8[&cThorium&8] &f%player% &7failed &e%check% &7(VL %vl%, %confidence%%)
warn-format=&c[Thorium] &fSuspicious activity detected (%check%). This is a warning.
kick-format=&cKicked by Thorium anti-cheat\n&7%reason%
