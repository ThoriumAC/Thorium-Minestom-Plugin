syntax = "proto3";

package thorium.mc.v1;

option java_package = "ac.thorium.mc.proto";
option java_multiple_files = true;

import "thorium/mc/v1/common.proto";

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_FLAG = 1;
  ACTION_WARN = 2;
  ACTION_KICK = 3;
  ACTION_BAN = 4;
  ACTION_UNBAN = 5;
}

message Verdict {
  PlayerRef player = 1;
  Action action = 2;
  string alert_type = 3;
  string reason = 4;
  double confidence = 5;
  bool shadow = 6;
  int64 issued_at_ms = 7;
  bytes alert_id = 8;
  double vl = 9;
  bool staff = 10;
}
