syntax = "proto3";

package thorium.mc.v1;

option java_package = "ac.thorium.mc.proto";
option java_multiple_files = true;

import "thorium/mc/v1/common.proto";
import "thorium/mc/v1/packets.proto";
import "thorium/mc/v1/verdict.proto";
import "thorium/mc/v1/world.proto";

message UpStream {
  oneof msg {
    Hello hello = 1;
    Batch batch = 2;
    Heartbeat heartbeat = 3;
    PlayerEvent player_event = 4;
    WorldChunk world_chunk = 5;
    WorldDelta world_delta = 6;
    Report report = 7;
    Activity activity = 8;
    BlockTags block_tags = 9;
  }
}

message BlockTags { repeated BlockTag tags = 1; }
message BlockTag { string name = 1; repeated string blocks = 2; }

message DownStream {
  oneof msg {
    HelloAck hello_ack = 1;
    Verdict verdict = 2;
    Control control = 3;
    Mitigate mitigate = 4;
    NetworkConfig config = 5;
  }
}

message Hello {
  string plugin_version = 1;
  string mc_version = 2;
  ServerSoftware software = 3;
  uint32 protocol = 4;
  repeated PlayerRef roster = 5;
  int64 flagged_at_ms = 6;
}

message HelloAck {
  bool accepted = 1;
  string reject_reason = 2;
  bytes server_id = 3;
  bytes organization_id = 4;
  IngestPolicy policy = 5;
  NetworkConfig config = 6;
}

message NetworkConfig {
  bool send_ips = 1;
  bool reports_enabled = 2;
  string kick_message = 3;
  string ban_message = 4;
  bool advanced_analytics = 5;
}

message Activity {
  repeated ActivityEvent events = 1;
}

message ActivityEvent {
  PlayerRef player = 1;
  int64 at_ms = 2;
  string kind = 3;
  string subject = 4;
  string detail = 5;
  PlayerRef target = 6;
  string world = 7;
  Vec3 position = 8;
  double amount = 9;
}

message Report {
  PlayerRef reporter = 1;
  PlayerRef suspect = 2;
  string reason = 3;
}

message Batch {
  int64 sent_at_ms = 1;
  repeated PlayerBatch players = 2;
  int64 server_tick = 3;
  double tps = 4;
  double mspt = 5;
}

message PlayerBatch {
  PlayerRef player = 1;
  repeated Sample samples = 2;
  ServerMeta meta = 3;
  bool relative_times = 4;
  int64 base_time_ms = 5;
  int64 base_tick = 6;
}

message Heartbeat {
  int64 client_time_ms = 1;
  int32 online_players = 2;
  double tps = 3;
  double mspt = 4;
}

message PlayerEvent {
  PlayerRef player = 1;
  int64 client_time_ms = 2;
  int64 tick = 3;
  oneof kind {
    Join join = 10;
    Quit quit = 11;
    Teleport teleport = 12;
    Velocity velocity = 13;
    Damage damage = 14;
    GamemodeChange gamemode = 15;
    WorldChange world = 16;
    Respawn respawn = 17;
    Boost boost = 18;
  }
}

message Join {
  string ip = 1;
  int32 protocol_version = 2;
  string brand = 3;
  int32 gamemode = 4;
  int32 entity_id = 5;
  string skin_texture = 6;
}
message Quit { string reason = 1; }
message Teleport { Vec3 to = 1; Look look = 2; string cause = 3; }
message Velocity { Vec3 velocity = 1; }
message Damage { string cause = 1; double amount = 2; double fall_distance = 3; }
message GamemodeChange { int32 gamemode = 1; }
message WorldChange { string dimension = 1; }
message Respawn {}
message Boost { string source = 1; }

message Control {
  oneof kind {
    IngestPolicy policy = 1;
    Disconnect disconnect = 2;
    PluginUpdate update = 3;
    Resync resync = 4;
  }
}

message IngestPolicy {
  int32 flush_interval_ms = 1;
  repeated string enabled_categories = 2;
  WorldPolicy world = 3;
  bool relative_sample_times = 4;
}
message Disconnect { string reason = 1; bool reconnect = 2; int32 backoff_ms = 3; }
message PluginUpdate { string version = 1; string download_url = 2; string sha256 = 3; }
message Resync {}

message Mitigate {
  PlayerRef player = 1;
  oneof kind {
    Setback setback = 10;
    CancelWindow cancel = 11;
    ResyncBlocks blocks = 12;
  }
}
message Setback { Vec3 position = 1; Look look = 2; bool keep_look = 3; }
message CancelWindow { int32 ticks = 1; }
message ResyncBlocks { string dimension = 1; sint32 sx = 2; sint32 sy = 3; sint32 sz = 4; }
