syntax = "proto3";

package thorium.mc.v1;

option java_package = "ac.thorium.mc.proto";
option java_multiple_files = true;

message SectionPos {
  string dimension = 1;
  sint32 x = 2;
  sint32 y = 3;
  sint32 z = 4;
}

message Section {
  SectionPos pos = 1;
  repeated string palette = 2;
  uint32 bits_per_index = 3;
  bytes indices = 4;
  string biome = 5;
}

message WorldBounds {
  string dimension = 1;
  sint32 min_y = 2;
  sint32 max_y = 3;
}

message WorldChunk {
  repeated Section sections = 1;
  bool full_sync_start = 2;
  bool full_sync_done = 3;
  repeated WorldBounds bounds = 4;
}

message BlockChange {
  uint32 offset = 1;
  string block = 2;
}

message SectionChanges {
  SectionPos section = 1;
  repeated BlockChange changes = 2;
}

message WorldDelta {
  int64 client_time_ms = 1;
  int64 tick = 2;
  repeated SectionChanges sections = 3;
  repeated SectionPos dropped = 4;
}

message WorldPolicy {
  bool enabled = 1;
  uint32 radius_chunks = 2;
  uint32 columns_per_tick = 3;
}
